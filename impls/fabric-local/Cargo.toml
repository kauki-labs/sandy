[package]
name = "sandy-fabric-local"
description = "Trivial local implementations of the sandy agent-fabric seams: the all-local MVP profile (spec sandy-agent-fabric.md §2, §6)"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/sandy-fabric-local"
keywords = ["sandbox", "agent", "fabric", "local"]
categories = ["development-tools"]

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
futures-core.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
rustix.workspace = true
sandy-api.workspace = true
sandy-fabric.workspace = true
sandy-proto.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "io-util", "time"] }
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
sandy-api.workspace = true
sandy-backend.workspace = true
sandy-fabric = { workspace = true, features = ["contract-tests"] }
sandy-proto.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["time", "io-util"] }
