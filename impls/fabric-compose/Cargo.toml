[package]
name = "sandy-fabric-compose"
description = "The agent-fabric composition root: the all-local MVP profile and its e2e acceptance (issue #115)"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/sandy-fabric-compose"
keywords = ["sandbox", "agent", "fabric", "compose"]
categories = ["development-tools"]

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dev-dependencies]
anyhow.workspace = true
hex.workspace = true
sandy-api.workspace = true
sandy-backend.workspace = true
# contract-tests: validate_profile (now a tests/acceptance.rs helper) calls
# the suite functions directly, which pulls in sandy_fabric::contract::fakes
# too (the feature gates both together). src/lib.rs has no production code
# that needs either, so this stays dev-only.
sandy-fabric = { workspace = true, features = ["contract-tests"] }
sandy-fabric-local.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["time"] }
