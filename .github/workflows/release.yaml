name: Release
# Releases are PREPARED but DISABLED until the operator enables them. The
# release-plz job is gated on the repository variable ENABLE_RELEASES; while
# it is unset the job is skipped and nothing is published, tagged, or
# released (this also keeps the workflow from running release-plz's
# release-pr step before we are ready).
#
# To enable: set the repo variable ENABLE_RELEASES=true. The current model
# (release-plz.toml): binaries (sandy-cli, sandyd, sandy-agent) get a GitHub
# release + <name>-<version> tag each. crates.io publishing is deferred for
# now (publish=false workspace-wide) — see release-plz.toml for what
# re-enabling it later requires (the trusted-publishing bootstrap).
on:
  push:
    branches: [main]
# Never run two releases at once, and never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
env:
  CACHIX_CACHE_NAME: sandy
jobs:
  release-plz:
    name: release-plz
    # Gated off until the milestone: set repo variable ENABLE_RELEASES=true to run.
    if: vars.ENABLE_RELEASES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create tags and GitHub releases
      pull-requests: write # open/update the release PR
      id-token: write # crates.io trusted publishing (OIDC token); unlisted perms default to none
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # release-plz reaches github.com; installing Nix needs sudo.
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Network binary cache: substitutes store paths from the sandy Cachix cache
      # and pushes what this job builds. This workflow only runs on push to main
      # (never a fork PR), so push always has CACHIX_AUTH_TOKEN available.
      - name: Cachix (sandy)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event.pull_request.head.repo.fork == true }}
      - name: Open release PR
        # Opened/updated with GITHUB_TOKEN, so GitHub's loop-prevention rule
        # applies: this push/PR does not trigger pr.yaml's pull_request event
        # (same restriction on every GITHUB_TOKEN-authored ref). Before merging,
        # push an empty commit or click "Update branch" on the PR to force a
        # synchronize event from a human push, so the PR-gate jobs and
        # release-diff-scope run and the required "Merge gate" check posts.
        # Check/Test don't run here regardless (merge-queue-only); they run
        # once this PR actually enters the queue.
        run: nix develop -c release-plz release-pr --git-token "${GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and release
        run: nix develop -c release-plz release --git-token "${GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # release-plz writes `*(scope)*` in the changelogs; treefmt wants `_(scope)_`.
      # Without this step the release PR fails its Format check on every regeneration.
      # Runs last: it switches the checkout to the release branch, and
      # `release-plz release` must see main. The push comes from GITHUB_TOKEN, so it
      # does not trigger pr.yaml either (same gap as above).
      - name: Format the release PR
        run: |
          set -euo pipefail
          branch="$(gh pr list --state open --search 'chore: release in:title' --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-plz-"))][0].headRefName // empty')"
          if [ -z "${branch}" ]; then
            echo "No open release PR; nothing to format."
            exit 0
          fi
          git fetch origin "${branch}"
          git switch --detach "origin/${branch}"
          nix fmt
          if git diff --quiet; then
            echo "Release PR already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore(release): format the generated changelogs"
          git push origin "HEAD:${branch}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
