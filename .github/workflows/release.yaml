name: Release
# Releases and crates.io publishing are PREPARED but DISABLED until the next
# milestone. The release-plz job is gated on the repository variable
# ENABLE_RELEASES; while it is unset the job is skipped and nothing is published,
# tagged, or released (this also keeps the workflow from running release-plz's
# release-pr step before we are ready).
#
# To enable at the milestone: complete the crates.io bootstrap (each crate's first
# manual publish — see release-plz.toml), then set the repo variable
# ENABLE_RELEASES=true. The prepared model (release-plz.toml): binaries get a
# GitHub release + <name>-<version> tag; all publishable crates publish to
# crates.io; the three test/local crates stay publish=false.
on:
  push:
    branches: [main]
# Never run two releases at once, and never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
env:
  CACHIX_CACHE_NAME: sandy
jobs:
  release-plz:
    name: release-plz
    # Gated off until the milestone: set repo variable ENABLE_RELEASES=true to run.
    if: vars.ENABLE_RELEASES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create tags and GitHub releases
      pull-requests: write # open/update the release PR
      id-token: write # crates.io trusted publishing (OIDC token); unlisted perms default to none
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # release-plz reaches github.com; installing Nix needs sudo.
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Network binary cache: substitutes store paths from the sandy Cachix cache
      # and pushes what this job builds. This workflow only runs on push to main
      # (never a fork PR), so push always has CACHIX_AUTH_TOKEN available.
      - name: Cachix (sandy)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event.pull_request.head.repo.fork == true }}
      - name: Open release PR
        # Opened/updated with GITHUB_TOKEN, so GitHub's loop-prevention rule
        # applies: this push/PR does not trigger pr.yaml's pull_request event
        # (same restriction on every GITHUB_TOKEN-authored ref). Before merging,
        # push an empty commit or click "Update branch" on the PR to force a
        # synchronize event from a human push, so Checks/Coverage/Package/
        # release-diff-scope run and the required "Merge gate" check posts.
        run: nix develop -c release-plz release-pr --git-token "${GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and release
        run: nix develop -c release-plz release --git-token "${GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
