name: PR
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
concurrency:
  group: ${{ github.event.pull_request.head.ref || github.ref_name }}-pr
  cancel-in-progress: true
env:
  CACHIX_CACHE_NAME: sandy
jobs:
  validate-pr-title:
    name: Validate title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            ci
            docs
            style
            refactor
            perf
            test
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
  label:
    name: Add labels
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
  release-diff-scope:
    # release-plz (release.yaml) opens its version-bump PR with GITHUB_TOKEN,
    # which the repo now allows (Settings -> Actions -> workflow permissions,
    # see actions_workflow_permissions.tf). Cap the blast radius of that PR: it
    # may only ever touch release bookkeeping, never e.g. .github/workflows/*.
    # Scoped to github-actions[bot] PRs only, so a contributor's own PR is
    # never restricted by this.
    # Note: a GITHUB_TOKEN-authored PR's pull_request runs sit in GitHub's
    # pending-approval gate until a maintainer approves them, so this check (and
    # the rest of the PR workflow) only runs on the release PR after that approval.
    name: Release diff scope
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Check changed files are release bookkeeping only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Per-crate versions (not a shared workspace version) mean a release-plz
          # bump PR edits each crate's own Cargo.toml, so allow those too.
          allowed='^(Cargo\.toml|Cargo\.lock|(crates|impls)/[^/]+/(Cargo\.toml|CHANGELOG\.md))$'
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          # printf, not echo: echo mishandles a filename that looks like a flag (e.g. "-n").
          bad=$(printf '%s\n' "$files" | grep -vE "$allowed" || true)
          if [[ -n "$bad" ]]; then
            echo "::error::release-plz PR touches files outside the release-bookkeeping allowlist:"
            echo "$bad"
            exit 1
          fi
  binary-versions:
    # Release-model invariant (release-plz.toml): releases are per-binary, and each
    # binary's MAJOR version must track sandy-lib's major so "sandy-cli 2.x" is
    # known to build on "sandy 2.x". Enforced here so it can't silently drift.
    name: Binary version alignment
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check each binary's major matches sandy-lib
        run: python3 scripts/ci/check-binary-major.py
  checks:
    name: Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # Installing Nix (multi-user daemon) needs sudo, so sudo stays enabled here.
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Network binary cache: substitutes store paths from the sandy Cachix cache
      # and pushes what this job builds. Fork PRs don't get CACHIX_AUTH_TOKEN
      # (secrets are withheld from fork-triggered pull_request runs), so push is
      # skipped there; the pull/substituter side still works unauthenticated.
      - name: Cachix (sandy)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event.pull_request.head.repo.fork == true }}
      # Persist the Nix store across runs, keyed on the lockfiles + nix files, so a
      # rerun restores the built Rust deps and crates instead of rebuilding them
      # cold. Per-job key; the store is GC'd to a budget before it is saved.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml', '**/Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ github.job }}-
          purge-created: 0
          purge-primary-key: never
      - name: Format
        run: nix build -L .#checks.x86_64-linux.treefmt
      - name: Lint
        run: nix build -L .#checks.x86_64-linux.clippy
      - name: Dependency hygiene
        run: nix build -L .#checks.x86_64-linux.shear
      - name: Supply-chain audit
        run: nix build -L .#checks.x86_64-linux.audit
      - name: Build and docs
        run: nix build -L .#checks.x86_64-linux.sandy .#checks.x86_64-linux.doc .#checks.x86_64-linux.pre-commit .#checks.x86_64-linux.project-docs
      - name: Guest-wrapper composition (eval-only)
        run: nix build -L .#checks.x86_64-linux.guest-wrapper-module-eval .#checks.x86_64-linux.guest-wrapper-configuration-eval
      - name: sandy-executor vm.enable additivity (eval-only)
        run: nix build -L .#checks.x86_64-linux.sandy-executor-vm-opt-eval
  test:
    # Plain `cargo nextest` (no cargo-llvm-cov instrumentation): the PR gate
    # just needs pass/fail, and the instrumented build is noticeably slower
    # for that. coverage.yaml runs the instrumented build once per push to
    # main instead, so the Codecov history still updates; this job just
    # stops re-running it per PR.
    # No `needs: checks`: it runs in parallel with Check (a failing Check no
    # longer skips it, which costs runner minutes but saves the Check wall clock).
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # Installing Nix (multi-user daemon) needs sudo, so sudo stays enabled here.
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cachix (sandy)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event.pull_request.head.repo.fork == true }}
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml', '**/Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ github.job }}-
          purge-created: 0
          purge-primary-key: never
      # End-to-end CLI suite (tests/e2e/basic): drive the built binary at the
      # process boundary (argv, exit bands, `-o json`, error paths). No hypervisor;
      # `--no-link` leaves the Test step's `result` symlink below untouched.
      - name: End-to-end CLI
        run: nix build -L --no-link .#checks.x86_64-linux.tests-e2e-cli
      # sandy-cli's `daemon_e2e` against the Nix-built `sandyd`; the coverage run
      # below excludes it, so without this step it never ran in CI.
      - name: Daemon end-to-end
        run: nix build -L --no-link .#checks.x86_64-linux.tests-daemon-e2e
      # Whole-workspace test run (tier-1/2); the `live` tier-3 tests need a
      # hypervisor and never run in CI, so they are excluded by design.
      - name: Test
        run: nix build -L .#checks.x86_64-linux.test
  package:
    # No `needs: checks`: the minimal shell shares no Nix outputs with Check, so
    # this runs in parallel with it.
    name: Package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # Installing Nix (multi-user daemon) needs sudo, so sudo stays enabled here.
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cachix (sandy)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event.pull_request.head.repo.fork == true }}
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml', '**/Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ github.job }}-
          purge-created: 0
          purge-primary-key: never
      # Publish dry-run: package every crate the way `cargo publish` will, in
      # dependency order, so a crates.io-publishability break (bad metadata, a
      # missing include, a version mismatch) fails before the release. Does not
      # upload. Runs in the minimal `package` dev shell (the toolchain only): it
      # needs the network, so it cannot be a sandboxed check, and the default
      # shell would also build sandy-agent first.
      #
      # The verify step recompiles the workspace on every run (about 4 to 11
      # minutes, cached by nothing), so a PR run skips it and the merge queue,
      # which still gates the merge, runs it in full.
      # `cargo package` only warns about a missing description or license (it exits 0), so
      # check them explicitly, in both the PR and the merge-queue path. `publish == []` is
      # `publish = false`, which is exempt.
      - name: Publish metadata (description and license)
        run: |
          set -o pipefail
          nix develop .#package -c cargo metadata --no-deps --format-version 1 | jq '[.packages[] | select(.publish != []) | select((.description // "") == "" or ((.license // "") == "" and (.license_file // "") == "")) | .name] as $bad | if ($bad | length) > 0 then ("publishable crates missing a description or a license: " + ($bad | join(", ")) + "\n") | halt_error(1) else empty end'
      - name: Package (publish dry-run, no verify)
        if: github.event_name == 'pull_request'
        run: nix develop .#package -c cargo package --workspace --all-features --no-verify
      - name: Package (publish dry-run, full verify)
        if: github.event_name == 'merge_group'
        run: nix develop .#package -c cargo package --workspace --all-features
  # Single aggregate merge gate: green only if every other job in this run
  # succeeded. Mark THIS one as the required check in branch protection, so
  # adding, renaming, or removing a job never needs a branch-protection change.
  # `if: always()` runs it even when a dependency fails; alls-green then reds the
  # gate on any non-success (a job that failed, or that skipped without being
  # allowed to).
  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - validate-pr-title
      - label
      - release-diff-scope
      - binary-versions
      - checks
      - test
      - package
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require all jobs to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # validate-pr-title and label only run on pull_request, so they skip on
          # merge_group; that skip is allowed and must not red the gate.
          # release-diff-scope additionally skips on every pull_request that
          # isn't a github-actions[bot] PR.
          allowed-skips: validate-pr-title, label, release-diff-scope
