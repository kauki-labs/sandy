name: PR
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
concurrency:
  group: ${{ github.event.pull_request.head.ref || github.ref_name }}-pr
  cancel-in-progress: true
env:
  CACHIX_CACHE_NAME: sandy
jobs:
  validate-pr-title:
    name: Validate title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            ci
            docs
            style
            refactor
            perf
            test
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
  label:
    name: Add labels
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
  release-diff-scope:
    # release-plz (release.yaml) opens its version-bump PR with GITHUB_TOKEN,
    # which the repo now allows (Settings -> Actions -> workflow permissions,
    # see actions_workflow_permissions.tf). Cap the blast radius of that PR: it
    # may only ever touch release bookkeeping, never e.g. .github/workflows/*.
    # Scoped to github-actions[bot] PRs only, so a contributor's own PR is
    # never restricted by this.
    name: Release diff scope
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Check changed files are release bookkeeping only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          allowed='^(Cargo\.toml|Cargo\.lock|crates/[^/]+/CHANGELOG\.md|impls/[^/]+/CHANGELOG\.md)$'
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          bad=$(echo "$files" | grep -vE "$allowed" || true)
          if [[ -n "$bad" ]]; then
            echo "::error::release-plz PR touches files outside the release-bookkeeping allowlist:"
            echo "$bad"
            exit 1
          fi
  checks:
    name: Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # Installing Nix (multi-user daemon) needs sudo, so sudo stays enabled here.
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Network binary cache: substitutes store paths from the sandy Cachix cache
      # and pushes what this job builds. Fork PRs don't get CACHIX_AUTH_TOKEN
      # (secrets are withheld from fork-triggered pull_request runs), so push is
      # skipped there; the pull/substituter side still works unauthenticated.
      - name: Cachix (sandy)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event.pull_request.head.repo.fork == true }}
      # Persist the Nix store across runs, keyed on the lockfiles + nix files, so a
      # rerun restores the built Rust deps and crates instead of rebuilding them
      # cold. Per-job key; the store is GC'd to a budget before it is saved.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml', '**/Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ github.job }}-
          purge-created: 0
          purge-primary-key: never
      - name: Format
        run: nix build -L .#checks.x86_64-linux.treefmt
      - name: Lint
        run: nix build -L .#checks.x86_64-linux.clippy
      - name: Dependency hygiene
        run: nix build -L .#checks.x86_64-linux.shear
      - name: Build and docs
        run: nix build -L .#checks.x86_64-linux.sandy .#checks.x86_64-linux.doc .#checks.x86_64-linux.pre-commit .#checks.x86_64-linux.project-docs
  coverage:
    # One test run, instrumented: cargo-llvm-cov runs the whole CI suite and emits
    # the lcov report, so a separate plain `cargo nextest` job would just run the
    # same tests again. This job is the test gate.
    name: Test
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # Installing Nix (multi-user daemon) needs sudo, so sudo stays enabled here.
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cachix (sandy)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event.pull_request.head.repo.fork == true }}
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml', '**/Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ github.job }}-
          purge-created: 0
          purge-primary-key: never
      # End-to-end CLI suite (tests/e2e/basic): drive the built binary at the
      # process boundary (argv, exit bands, `-o json`, error paths). No hypervisor;
      # `--no-link` leaves the coverage `result` symlink below untouched.
      - name: End-to-end CLI
        run: nix build -L --no-link .#checks.x86_64-linux.tests-e2e-cli
      # Line coverage over the CI-runnable suite (tier-1/2); the `live` tier-3 tests
      # need a hypervisor and never run in CI, so they are excluded by design.
      - name: Coverage
        run: nix build -L .#checks.x86_64-linux.coverage
      - name: Upload lcov report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage-lcov
          path: result/lcov.info
          if-no-files-found: error
      # Publish to Codecov for the badge and PR annotations. A reporting hiccup
      # must not fail the PR, so fail_ci_if_error stays false.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: result/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  package:
    name: Package
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # Installing Nix (multi-user daemon) needs sudo, so sudo stays enabled here.
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cachix (sandy)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event.pull_request.head.repo.fork == true }}
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml', '**/Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ github.job }}-
          purge-created: 0
          purge-primary-key: never
      # Publish dry-run: package and verify every crate the way `cargo publish`
      # will, in dependency order, so a crates.io-publishability break (bad
      # metadata, a missing include, a version mismatch) fails the PR instead of
      # the release. Does not upload.
      - name: Package (publish dry-run)
        run: nix develop -c cargo package --workspace --all-features
  # Single aggregate merge gate: green only if every other job in this run
  # succeeded. Mark THIS one as the required check in branch protection, so
  # adding, renaming, or removing a job never needs a branch-protection change.
  # `if: always()` runs it even when a dependency fails; alls-green then reds the
  # gate on any non-success (a job that failed, or that skipped without being
  # allowed to).
  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - validate-pr-title
      - label
      - release-diff-scope
      - checks
      - coverage
      - package
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require all jobs to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # validate-pr-title and label only run on pull_request, so they skip on
          # merge_group; that skip is allowed and must not red the gate.
          # release-diff-scope additionally skips on every pull_request that
          # isn't a github-actions[bot] PR.
          allowed-skips: validate-pr-title, label, release-diff-scope
