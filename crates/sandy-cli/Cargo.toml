[package]
name = "sandy-cli"
description = "The sandy command-line interface: run a job in an ephemeral NixOS microVM and get a locked result envelope"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/sandy-cli"
keywords = ["sandbox", "microvm", "cli", "isolation", "nixos"]
categories = ["command-line-utilities", "virtualization", "development-tools"]

[[bin]]
name = "sandy"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The live_boot / host_matrix live acceptance gates (tier-3, #26/#27). Off by default so
# CI and `nix flake check` never try to boot a VM; enable on the live host.
live = []

[dependencies]
clap.workspace = true
octocrab.workspace = true
sandy.workspace = true
# The CLI runs real VMs, so it pulls the VM backend impls in (impl-local stays on
# by default); a local-only consumer of sandy-backend would omit impl-vm.
sandy-backend = { workspace = true, features = ["impl-vm"] }
serde.workspace = true
serde_json.workspace = true
tiny_http.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
anyhow.workspace = true
rstest.workspace = true
sandy-test-support.workspace = true
tempfile.workspace = true
