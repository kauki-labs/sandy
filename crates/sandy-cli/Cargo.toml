[package]
name = "sandy-cli"
description = "The sandy command-line interface (Blocks 0 doctor, 6 run/ls/status/...)"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "sandy"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The live_boot / host_matrix live acceptance gates (tier-3, #26/#27). Off by default so
# CI and `nix flake check` never try to boot a VM; enable on the live host.
live = []

[dependencies]
clap.workspace = true
sandy.workspace = true
sandy-backend.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
rstest.workspace = true
tempfile.workspace = true
