[package]
name = "sandy-mcp"
description = "Thin MCP stdio frontend over the sandyd broker API: job and environment tools, one tool call per API request, no dispatch logic (#585)"
version = "0.1.1"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
publish = false

[lints]
workspace = true

[features]
# The live_broker tier-3 gate (#585): real sandyd, sandy-broker and a qemu guest. Off by default so CI and
# `nix flake check` never boot a VM; enable on the Linux/KVM live host.
live = []

[dependencies]
clap.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "rt", "macros"] }

[dev-dependencies]
anyhow.workspace = true
# The live gate resolves the staging base by the backend's own constant. No control-proto edge (layering.rs).
sandy-fsutil.workspace = true
# The live gate writes the broker's clients file, which holds the SHA-256 of the bearer token.
sha2.workspace = true
tempfile.workspace = true
tiny_http.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
