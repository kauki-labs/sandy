syntax = "proto3";

package sandy.control.v1;

// sandyd's control-plane RPC: Submit/Cancel/Attach/Status/List (epic #205,
// B0 #211). Pure request/response — never streaming. Job output, telemetry,
// and escalation ride the fabric's channels (ChannelBackend/Channel), not
// this RPC; Attach hands back the channel identity + cap for that, it does
// not stream the output itself.
//
// One request, one matching response, per connection, in order: a client
// sends a ControlRequest and waits for exactly one ControlResponse with the
// same request_id before sending the next. No pipelining in v1; request_id
// exists for forward-compat and for correlating logs, not for reordering.

// A client-to-daemon call.
message ControlRequest {
  // Caller-chosen, unique per connection. Echoed on the matching response.
  // proto3 gives this field no separate presence bit, so an unset
  // request_id and an explicit 0 are the same value on the wire: 0 means
  // absent. sandy_control_proto::client::call refuses to send a request with
  // request_id 0, before anything is written, rather than letting it ride to
  // the wire and risk matching a different in-flight call that also
  // defaulted to 0.
  uint64 request_id = 1;

  oneof op {
    SubmitRequest submit = 10;
    CancelRequest cancel = 11;
    AttachRequest attach = 12;
    StatusRequest status = 13;
    ListRequest list = 14;
    // Environment operations (#587, slice A2). Served by sandyd's environment
    // handler, separate from the job operations above.
    CreateEnvironmentRequest create_environment = 20;
    GetEnvironmentRequest get_environment = 21;
    ListEnvironmentsRequest list_environments = 22;
    StopEnvironmentRequest stop_environment = 23;
    ResumeEnvironmentRequest resume_environment = 24;
    CancelEnvironmentRequest cancel_environment = 25;
    DeleteEnvironmentRequest delete_environment = 26;
  }
}

// A daemon-to-client reply.
message ControlResponse {
  // Matches the ControlRequest.request_id this answers. Same 0-means-absent
  // contract as ControlRequest.request_id: a response carrying 0 here is
  // never treated as a wildcard match for whatever the client happened to
  // send.
  uint64 request_id = 1;

  oneof result {
    SubmitResponse submit = 10;
    CancelResponse cancel = 11;
    AttachResponse attach = 12;
    StatusResponse status = 13;
    ListResponse list = 14;
    ControlError error = 15;
    EnvironmentResponse environment = 20;
    ListEnvironmentsResponse environments = 21;
    // A typed refusal of an environment operation. Kept apart from
    // `ControlError` so the job operations' error shape is untouched.
    EnvironmentError environment_error = 22;
  }
}

// A job's lifecycle state.
enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
}

// Whether a job may run on a shared-kernel backend (trusted) or needs a full
// hypervisor boundary (untrusted, #150's decision). Mirrors
// `sandy_executor_proto::IsolationClass` one-for-one, defined separately here
// so this client-facing wire contract carries no dependency on the internal
// orchestrator<->host-executor proto; `sandyd::handler` converts between the
// two. UNSPECIFIED is never a usable value on `SubmitRequest` (#381) — it is
// refused at Submit, not defaulted to TRUSTED.
enum IsolationClass {
  ISOLATION_CLASS_UNSPECIFIED = 0;
  ISOLATION_CLASS_TRUSTED = 1;
  ISOLATION_CLASS_UNTRUSTED = 2;
}

// Submit a job. `manifest` is opaque here: the typed, submitter-bounded
// JobManifest (capped at the submitter's own attenuation, decision C) is
// B3's job (#205) — B0 only defines the envelope it travels in, not its
// shape. A later version of this message replaces `bytes` with the real
// typed field; `manifest_encoding` exists so that transition can be
// detected on the wire instead of guessed at.
message SubmitRequest {
  bytes manifest = 1;
  // Names the encoding of `manifest` (e.g. "sandy.orchestrator.v1.JobManifest"
  // once B3 defines it). Empty/unset means "undefined, reject" — never a
  // silent default interpretation of unknown bytes.
  string manifest_encoding = 2;
  // Capabilities the submitter itself holds, each an `encode_cap`-encoded
  // `sandy_fabric::capauth::Cap` (#226, decision C-at-Submit). The submitter's
  // identity is carried inside each cap's own `scope.peer` — no separate
  // identity field. Bearer-cap authn, the same mechanism every other seam in
  // the fabric already uses (Channel::join, AttachResponse's cap, the agent
  // bootstrap handoff), not a connection-level identity: trust that a
  // connection may submit AT ALL still comes from the transport (the 0700
  // UDS socket today), these caps only bound WHAT a manifest's additional
  // `requested_caps` may be granted. Empty means the manifest requests
  // nothing beyond the job's own dedicated channel — sandyd mints that
  // directly, as it always has; it is never a silent way to escalate a
  // REQUESTED cap past what would otherwise be checked.
  repeated bytes submitter_caps = 3;
  // The job's required isolation class (#381). UNSPECIFIED is refused at
  // Submit — every client must state TRUSTED or UNTRUSTED explicitly, never
  // a silent default, since defaulting an unstated class to TRUSTED would
  // breach isolation for a client that meant to ask for UNTRUSTED.
  IsolationClass required_isolation_class = 4;
  // Path fields (#496, sandyd.md decision 21): read-only inputs, collected
  // outputs, and file-sourced secrets, named on the SUBMITTER's own
  // filesystem — never inside `manifest` (decision 21 keeps spec.md's P2
  // intact: the manifest names data, never a submitter path, regardless of
  // which host decodes it). Non-empty here requires placement onto a
  // host-executor that declared `shares_submitter_filesystem` at Register;
  // a Submit carrying one of these with no such host placeable is refused
  // with the field named, never silently dropped or placed remotely.
  repeated Input inputs = 5;
  repeated Output outputs = 6;
  repeated SecretRef secrets = 7;
  // A daemon-minted forge credential (#481, sandyd.md decision 37): the name of
  // a trust root `sandy cred github register` wrote on the daemon's host, the
  // same name `sandy run --credential` takes. sandyd mints a scoped token before
  // dispatch (a mint failure refuses the Submit), hands it to the job as the
  // `GITHUB_TOKEN` secret file, and revokes it on every terminal state. Like a
  // path field, it requires a host-executor that declared
  // `shares_submitter_filesystem`; a Submit that could only place remotely is
  // refused, since no encrypted mesh transport carries the token yet (#495).
  // The token itself never rides any wire field.
  optional string credential = 8;
  // Capabilities for `credential`, in `sandy run --cred-capability` spelling
  // (`read-code`, `write-code`, `read-pr`, `write-pr`); empty means
  // `read-code`. Refused without `credential`.
  repeated string cred_capabilities = 9;
  // The job's egress policy (`sandy run --allow`, #360). Absent means no policy.
  // Present, even with no rules, means the guest runs behind the per-run egress
  // proxy with exactly these destinations (an empty list denies all). A message
  // field, not a bare `repeated`, so absent and empty stay different on the wire.
  // Wire only for now: nothing sets or reads it yet.
  EgressPolicy egress = 10;
}

// A job's egress allow-list: the only destinations the guest may reach.
message EgressPolicy {
  repeated EgressRule rules = 1;
}

message EgressRule {
  string host = 1;
  uint32 port = 2;
}

// Mirrors `sandy_api::backend::Input`. A host path exposed read-only in the
// guest at `/run/sandy/inputs/<name>`, optionally also symlinked to an
// absolute guest path.
message Input {
  string host = 1;
  string name = 2;
  optional string guest_path = 3;
}

// Mirrors `sandy_api::backend::Output`. `name` unset is the catch-all: the
// whole `/run/sandy/outputs` tree collected to `dest`.
message Output {
  optional string name = 1;
  string dest = 2;
}

// Mirrors `sandy_api::backend::SecretRef` with a file-backed source only —
// `SecretSource::Fd` has no wire representation; a submitted secret always
// names a host file. The bytes never ride this message or any other wire
// field; only the path does, same as `--secret NAME=@PATH` today.
message SecretRef {
  string name = 1;
  string host_path = 2;
}

message SubmitResponse {
  string job_id = 1;
  // A durable bearer credential (#327), independent of this connection's
  // CF-H-1 session: presented back on a LATER `AttachRequest` to prove "I'm
  // the one who submitted this job" even from a fresh connection (the
  // realistic case — `daemon submit` now, `daemon attach` later from a new
  // terminal). The daemon persists the matching value in the job's own
  // durable store row, not in process-local `JobRegistry` state, so it
  // survives the submitting connection closing. A bearer credential like
  // every other cap-shaped value here: never logged, travels only this one
  // field and the matching `AttachRequest.attach_token`.
  bytes attach_token = 2;
}

message CancelRequest {
  string job_id = 1;
  // The job's durable `SubmitResponse.attach_token` (#327). Required to cancel
  // (#540, owner decision on audit #391): a Cancel with no token, a wrong one, or
  // one for another job is refused, and the refusal does not say which. Optional
  // on the wire so an old client's request still decodes, then is refused.
  optional bytes attach_token = 2;
}

message CancelResponse {}

// Attach to a running (or recently finished) job's output. Does not stream
// output itself: the daemon mints an attenuated cap scoped to that job's
// orchestrator channel (the attenuation is B3's job) and hands back enough
// for the client to `join`/`subscribe` on the data plane directly.
message AttachRequest {
  string job_id = 1;
  // The durable bearer credential `SubmitResponse.attach_token` handed back
  // at submit time (#327), presented to prove the attacher is the original
  // submitter even from a fresh connection/session. Absent (or not
  // matching) falls back to the existing per-connection `session_matches`
  // check — this is additive, not a replacement: a submit-then-immediately-
  // attach on the SAME connection still works with no token at all.
  optional bytes attach_token = 2;
  // The broker's output collector (#643): ask for the dedicated collector cap, a
  // read-only membership of its own that attach counting ignores. Needs a matching
  // `attach_token`; otherwise the request is refused.
  bool collector = 3;
}

message AttachResponse {
  string channel_id = 1;
  // The encoded, attenuated channel-join Cap (sandy_fabric::capauth::Cap via
  // encode_cap) scoped to this job's orchestrator channel.
  bytes cap = 2;
}

message StatusRequest {
  string job_id = 1;
}

message StatusResponse {
  string job_id = 1;
  JobStatus status = 2;
  // A terminal job's guest exit code, once a remote run reports one back
  // (#292): unset while the job is still PENDING/RUNNING, or when it reached a
  // terminal state without producing an exit (an infra fault, a timeout, a
  // cancel). `status` is the lifecycle band; this is the raw process code the
  // orchestrator classified that band from, surfaced so a caller sees exactly
  // what the job exited with, not just SUCCEEDED/FAILED.
  optional int32 exit_code = 3;
  // A bounded tail of the job's own stdout/stderr, surfaced once a remote run
  // reports it back — the one place a cross-machine job's output is visible to
  // a caller that cannot reach the host. Empty while the job has reported none.
  string console_tail = 4;
  // A terminal job's result envelope (INV-11), as the envelope's own JSON: the same locked `ResultEnvelope` a direct
  // `sandy run` prints, built by the daemon from the host's report (A2 of #483). Unset while the job is PENDING or
  // RUNNING, and for a job recorded before the daemon stored envelopes. Bytes, not a second proto copy, so the serde
  // schema and its `result_schema_version` stay the one source of truth.
  optional bytes result_envelope = 5;
}

message ListRequest {}

message JobSummary {
  string job_id = 1;
  JobStatus status = 2;
}

message ListResponse {
  repeated JobSummary jobs = 1;
}

// A control-plane failure: the request was understood but could not be
// honoured (unknown job id, already-cancelled job, not-yet-dispatchable,
// …). Never silently folded into a success response with default fields.
message ControlError {
  string message = 1;
}

// ---- Environments (#587, slice A2) ----------------------------------------

// What an environment is, independent of who asked for it. The store keeps
// the prost encoding of this message as the create payload, so two retries
// with equal fields are byte-equal whatever order a client wrote them in.
message EnvironmentSpec {
  // A credential identity profile name (#592). Never a secret.
  string profile = 1;
  // A size class name; empty means the daemon's default.
  string size = 2;
  EnvironmentLifetime lifetime = 3;
  // An opaque caller reference for the task this environment serves.
  string task_ref = 4;
}

message EnvironmentLifetime {
  EnvironmentLifetimeKind kind = 1;
  // Seconds until the daemon deletes an ephemeral environment. Required (>= 1)
  // for EPHEMERAL, forbidden for PERSISTENT.
  uint64 ttl_secs = 2;
}

enum EnvironmentLifetimeKind {
  ENVIRONMENT_LIFETIME_KIND_UNSPECIFIED = 0;
  // Lives for one task: has a TTL and cannot be stopped or resumed.
  ENVIRONMENT_LIFETIME_KIND_EPHEMERAL = 1;
  ENVIRONMENT_LIFETIME_KIND_PERSISTENT = 2;
}

// An environment's lifecycle state.
enum EnvironmentState {
  ENVIRONMENT_STATE_UNSPECIFIED = 0;
  ENVIRONMENT_STATE_PROVISIONING = 1;
  ENVIRONMENT_STATE_READY = 2;
  ENVIRONMENT_STATE_STOPPED = 3;
  ENVIRONMENT_STATE_FAILED = 4;
  ENVIRONMENT_STATE_DELETED = 5;
}

// Create an environment. Idempotent by `idempotency_key`: the same key and
// spec return the same environment, another spec under the same key is
// refused with REQUEST_ID_CONFLICT.
message CreateEnvironmentRequest {
  string idempotency_key = 1;
  EnvironmentSpec spec = 2;
  // The isolation class the caller is cleared for, set by the broker from its
  // client record. Not part of the spec: it never changes the idempotency bytes.
  // While a trusted-only backend (the process backend) is active, anything but
  // TRUSTED, including UNSPECIFIED, is refused with FORBIDDEN.
  IsolationClass submitter_class = 3;
}

message GetEnvironmentRequest {
  string environment_id = 1;
}

message ListEnvironmentsRequest {
  // Unset (UNSPECIFIED) lists every state.
  EnvironmentState state = 1;
  // Empty lists every task_ref.
  string task_ref = 2;
  // Rows per page. 0 means the daemon default (100); above 500 is clamped to 500.
  uint32 page_size = 3;
  // Continue after this environment id: the `next_page_token` of the previous
  // page. Empty starts at the first row.
  string page_token = 4;
}

message StopEnvironmentRequest {
  string environment_id = 1;
}

message ResumeEnvironmentRequest {
  string environment_id = 1;
}

// Cancel provisioning: only valid while PROVISIONING; ends DELETED.
message CancelEnvironmentRequest {
  string environment_id = 1;
}

// Delete: valid from every state but DELETED, idempotent.
message DeleteEnvironmentRequest {
  string environment_id = 1;
}

message EnvironmentFailure {
  string step = 1;
  string reason = 2;
}

message EnvironmentConnection {
  // Where a client reaches the environment's service. Present only when READY.
  string url = 1;
}

message EnvironmentResponse {
  string environment_id = 1;
  EnvironmentState state = 2;
  // Ordered provisioning step names with their status. Empty until the
  // launch driver (slice C) reports steps.
  repeated string steps = 3;
  EnvironmentFailure failure = 4;
  EnvironmentConnection connection = 5;
  EnvironmentSpec spec = 6;
  // The last renewal of the environment's forge credential failed (#706): the service runs on a token that
  // will expire. Cleared by the next successful renewal.
  bool credential_degraded = 7;
  // Why the credential could not be revoked at the last stop, delete or failure (#706). Never a token. Empty
  // when the last revoke worked or none ran.
  string credential_revoke_error = 8;
}

message ListEnvironmentsResponse {
  repeated EnvironmentResponse environments = 1;
  // Pass as `page_token` to read the next page. Empty on the last page.
  string next_page_token = 2;
}

enum EnvironmentErrorCode {
  ENVIRONMENT_ERROR_CODE_UNSPECIFIED = 0;
  ENVIRONMENT_ERROR_CODE_NOT_FOUND = 1;
  ENVIRONMENT_ERROR_CODE_REQUEST_ID_CONFLICT = 2;
  ENVIRONMENT_ERROR_CODE_QUOTA_EXCEEDED = 3;
  ENVIRONMENT_ERROR_CODE_UNSUPPORTED_FOR_LIFETIME = 4;
  ENVIRONMENT_ERROR_CODE_INVALID_STATE = 5;
  ENVIRONMENT_ERROR_CODE_INVALID_ARGUMENT = 6;
  ENVIRONMENT_ERROR_CODE_FORBIDDEN = 7;
  // sandyd could not write the audit entry for the operation, so it did not apply it.
  ENVIRONMENT_ERROR_CODE_UNAVAILABLE = 8;
}

message EnvironmentError {
  EnvironmentErrorCode code = 1;
  string message = 2;
}
