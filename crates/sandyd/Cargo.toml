[package]
name = "sandyd"
description = "sandyd: the per-machine control-plane daemon dispatching jobs into the agent fabric (epic #205)"
version = "0.2.2"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/sandyd"
keywords = ["daemon", "control-plane", "sandbox", "orchestrator"]
categories = ["command-line-utilities"]

[[bin]]
name = "sandyd"
path = "src/main.rs"

[features]
# A stub forge trust root for the live broker gate (#733): a provider that mints a fake token and calls no network.
# Off by default and not enabled in the release build. A daemon with SANDYD_STUB_TRUST_ROOT set refuses to start
# without it.
stub-trust-root = []

[lints]
workspace = true

[dependencies]
# The reusable credential bracket and trust-root resolution (#481).
sandy.workspace = true
sandy-api.workspace = true
sandy-control-proto.workspace = true
sandy-environment.workspace = true
sandy-executor-proto.workspace = true
sandy-conn.workspace = true
sandy-fabric.workspace = true
sandy-fabric-local.workspace = true
sandy-fsutil.workspace = true
sandy-guest-template.workspace = true
sandy-orchestrator.workspace = true
sandy-proto.workspace = true
fs2.workspace = true
# The attach relay's (#327) channel-output delivery task drains a `Stream`.
futures-util.workspace = true
# The attach data plane (#327) rides `sandy_fabric_local::link`'s hex-encoded
# LinkFrame payloads.
hex.workspace = true
rustix.workspace = true
getrandom.workspace = true
prost.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "net",
  "signal",
  "io-util",
  "macros",
  "sync",
  "time",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

# The `vm-qemu` (Linux: KVM, vhost-vsock) and `vm-vfkit` (macOS) environment backends (#587) boot microVMs.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
sandy-backend = { workspace = true, features = ["impl-vm"] }

[dev-dependencies]
anyhow.workspace = true
# The handler tests tamper with caps through `Cap::proof_mut`/`scope_mut`, which exist only
# with this feature (#385). A dev-dependency feature is not enabled in a normal build.
sandy-fabric = { workspace = true, features = ["contract-tests"] }
sandy-host-executor.workspace = true
sandy-test-support.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
