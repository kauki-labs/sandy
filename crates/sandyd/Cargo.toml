[package]
name = "sandyd"
description = "sandyd: the per-machine control-plane daemon dispatching jobs into the agent fabric (epic #205)"
version = "0.1.1"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/sandyd"
keywords = ["daemon", "control-plane", "sandbox", "orchestrator"]
categories = ["command-line-utilities"]

[[bin]]
name = "sandyd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sandy-control-proto.workspace = true
sandy-executor-proto.workspace = true
sandy-conn.workspace = true
sandy-fabric.workspace = true
sandy-fabric-local.workspace = true
sandy-fsutil.workspace = true
sandy-orchestrator.workspace = true
sandy-proto.workspace = true
fs2.workspace = true
# The attach relay's (#327) channel-output delivery task drains a `Stream`.
futures-util.workspace = true
# The attach data plane (#327) rides `sandy_fabric_local::link`'s hex-encoded
# LinkFrame payloads.
hex.workspace = true
rustix.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "net",
  "signal",
  "io-util",
  "macros",
  "sync",
  "time",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
