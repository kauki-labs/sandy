[package]
# Published as `sandy-lib` (the crates.io name `sandy` is taken); the crate still
# compiles and imports as `sandy` via `[lib] name` below, so `use sandy::…` is
# unchanged in-tree and for dependents (which alias it with `package = "sandy-lib"`).
name = "sandy-lib"
description = "The sandy sandbox library: run plane, provisioning, seed verification, egress, and operability behind one curated API"
version = "0.1.1"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/sandy-lib"
keywords = ["sandbox", "microvm", "isolation", "nixos", "vm"]
categories = ["virtualization", "development-tools", "command-line-utilities"]

[lib]
name = "sandy"
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
sandy-api.workspace = true
sandy-fsutil.workspace = true
rustix.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true }
serde_json.workspace = true
fs2.workspace = true
libc.workspace = true
uuid = { workspace = true }
minisign-verify.workspace = true
sha2.workspace = true
hex.workspace = true
octocrab.workspace = true
tokio.workspace = true
jsonwebtoken.workspace = true

[dev-dependencies]
anyhow.workspace = true
insta.workspace = true
rstest.workspace = true
sandy-test-support.workspace = true
tempfile.workspace = true
octocrab.workspace = true
tokio.workspace = true
