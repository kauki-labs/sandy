syntax = "proto3";

package sandy.executor.v1;

// The orchestrator<->host-executor contract (#263, epic #205 M2): a
// capability-declaring registration (kubelet-style) plus the dispatch RPC.
// Rides sandy-conn's TCP/mesh tier. One persistent, bidirectional connection
// per host-executor: the host-executor sends Register once, then the
// orchestrator pushes zero or more Dispatch messages down the SAME
// connection as it places jobs there. The connection staying open is the
// liveness signal for that host — no separate heartbeat protocol.
//
// This is deliberately not the control RPC's shape (sandy-control-proto,
// decision 1: pure request/response, no pipelining): a management channel
// needs server push, a client call does not. Different protocol, different
// crate, same framing style (length-prefixed, write_frame/read_frame).

// Host-client -> orchestrator.
message HostExecutorMessage {
  oneof op {
    Register register = 1;
    JobResult result = 2;
  }
}

// A finished dispatch's physical outcome, reported back up the SAME management
// connection the Dispatch arrived on, once the host-executor has run the job to
// completion (or failed to). `job_id` ties it back to its Dispatch. Without
// this, a job that ran remotely stays JOB_STATUS_PENDING forever: the outcome
// never leaves the host (#292's un-run-Pending strand).
//
// The host reports FACTS here, not a classified status: it mirrors
// `sandy_api::backend::Outcome` 1:1, and the orchestrator maps these fields
// into a terminal `sandy.control.v1.JobStatus` itself — the same split the
// backend seam already draws ("the backend returns the physical Outcome only;
// the core maps that into the result bands"). No field here is ever a secret
// (INV-1): the per-run `link_token` and the like are never placed on it.
message JobResult {
  string job_id = 1;
  // Whether the guest booted / the sandbox launched.
  bool booted = 2;
  // The guest process exit code, if it ran to completion; unset if it never
  // produced one (never booted, a transport fault, or a timeout).
  optional int32 exit_code = 3;
  // Whether the run hit its wall-clock timeout.
  bool timed_out = 4;
  // A transport/protocol error string if the agent channel failed, else unset.
  optional string transport_error = 5;
  // A bounded tail of the job's OWN stdout/stderr (up to ~64 KiB), for
  // `status`/`attach` to surface. This is the job's output, never the host's
  // own journald logs — the host-executor must not `tracing!`-log it.
  string console = 6;
  // Outputs are still coming on the data link (#482, §22). `JobResult` (this
  // connection) and the output transfer (the data link) are two connections
  // with no ordering between them, so a result that arrives first must not
  // read as the job being done. True: the orchestrator keeps the job
  // non-terminal until the matching `OutputEnd` arrives or a `TransferError`
  // or a disconnect ends the transfer. False (also a sender that predates the
  // field): nothing follows.
  bool outputs_follow = 7;
}

// Orchestrator -> host-executor.
message OrchestratorMessage {
  oneof op {
    Registered registered = 1;
    RegisterRefused refused = 2;
    Dispatch dispatch = 3;
    AttachStateChanged attach_state_changed = 4;
    Cancel cancel = 5;
  }
}

// What an executor can run (mirrors sandy_fabric::executor::{SandboxKind, Arch}).
// A closed set today; grows additively (kvm, qemu, vfkit, faas, proxmox) per
// D2 — no contract break when a new target lands.
enum SandboxKind {
  SANDBOX_KIND_UNSPECIFIED = 0;
  SANDBOX_KIND_PROCESS = 1;
  SANDBOX_KIND_VM = 2;
}

enum Arch {
  ARCH_UNSPECIFIED = 0;
  ARCH_X86_64 = 1;
  ARCH_AARCH64 = 2;
}

// Whether a job may run on a shared-kernel backend (trusted-process) or needs
// a full hypervisor boundary (#150, VM/untrusted isolation). The gate is
// fail-closed in both directions (#269's spec, the isolation-class
// requirement): the orchestrator must not dispatch, and the executor must
// refuse, any job whose required class a host's declared capabilities cannot
// provide — never a silent downgrade onto trusted-process.
enum IsolationClass {
  ISOLATION_CLASS_UNSPECIFIED = 0;
  ISOLATION_CLASS_TRUSTED = 1;
  ISOLATION_CLASS_UNTRUSTED = 2;
}

message Capabilities {
  // The sandbox kinds this host can actually run — a SET, not a single value
  // (#332): a host declaring both `Process` and `Vm` is ordinary once a host
  // runs both a trusted-process backend and a real hypervisor. Field number
  // kept at 1 (was a singular `SandboxKind kind = 1` before #332): prost
  // decodes an old singular-enum wire value as a one-element repeated field
  // on the new generated type, so a not-yet-redeployed host-executor sending
  // the old shape still registers correctly as `[kind]` — no live Capabilities
  // data is ever persisted (only sent over an active connection), so this is
  // a safe in-place field change, not a migration.
  repeated SandboxKind supported_sandbox_kinds = 1;
  Arch arch = 2;
  // sandy_fabric::executor::Attestation is a stub (unit struct) today;
  // carried as presence until it grows real fields.
  bool attestation = 3;
  // The isolation classes this host's declared backend(s) can actually
  // provide. Stage 1's trusted-process backend declares only TRUSTED — its
  // `bwrap` sandbox shares the host network namespace with no egress
  // enforcement, so it must never be offered as a backend for an UNTRUSTED
  // job (#269: "stage 1 accepts trusted jobs only").
  repeated IsolationClass supported_isolation_classes = 4;
  // Whether this host-executor shares the submitter's own filesystem (#496,
  // sandyd.md decision 21) — set by the host-executor's own startup
  // configuration (`SANDY_HOST_SHARES_SUBMITTER_FS`), never auto-detected
  // from the mesh peer address: a loopback IP does not imply a shared
  // filesystem (a co-located container can have its own mount namespace),
  // and a genuinely remote host can tunnel to appear local. Default false —
  // an undeclared host is never assumed local. The orchestrator only places
  // a Dispatch carrying path fields (`inputs`/`outputs`/`secrets`) on a host
  // that declares this true.
  bool shares_submitter_filesystem = 5;
  // Whether this host-executor is deployed to receive and send a job's
  // `inputs`/`outputs` over the per-job data link (#482, sandyd.md §22): the
  // operator has provided disk headroom and a temp-staging path. Never
  // auto-detected. Default false, so a host-executor that predates this field
  // decodes as not accepting transfers. It never covers `secrets` or a
  // `credential`: those stay tied to `shares_submitter_filesystem` (decision 4).
  // Declared on the wire first; the orchestrator does not place on it until the
  // data link exists.
  bool transfer = 6;
}

// Declares this host's identity and what it can run.
//
// host_id is a self-reported, human-readable label for bookkeeping and
// placement — it is NEVER the authorization boundary. The orchestrator
// authenticates the registrant by the TRANSPORT's own peer identity (mesh
// IP) against its own allowlist of known executor hosts (D5, the Register
// ruling on #263): an unknown registrant gets RegisterRefused, not
// Registered, and is logged — trusting a self-reported id for authorization
// would repeat the exact mistake decision 6 exists to prevent.
message Register {
  string host_id = 1;
  Capabilities capabilities = 2;
}

message Registered {
  string host_id = 1;
}

// The registrant's mesh identity is not on the orchestrator's executor
// allowlist. Carries no capability or job data — a refusal must never leak
// more than "no".
message RegisterRefused {
  string reason = 1;
}

// Run `manifest` on `backend`; forward the sandbox agent's link back to
// `forward_back` using `job_id` + `link_token` as the mesh-accept-loop demux
// prefix (decision 6). `link_token` is a bearer secret (INV-1): the
// host-executor holds it only in forwarder memory, never logs it, never writes
// it to the job's manifest, env, or mounts.
message Dispatch {
  string job_id = 1;
  bytes manifest = 2;
  // Mirrors SubmitRequest.manifest_encoding (sandy-control-proto):
  // empty/unset means "undefined, reject" — never a silent default.
  string manifest_encoding = 3;
  SandboxKind backend = 4;
  bytes link_token = 5;
  // "host:port" on the orchestrator's mesh interface, for the host-executor's
  // fresh dial (sandy_conn::connect(ConnAddr::Tcp(..))) before
  // forward_agent_link — a separate stream from this management connection.
  string forward_back = 6;
  // The job's required isolation class. The orchestrator must not send this
  // Dispatch at all if `backend`'s host never declared this class in its
  // Capabilities; the executor re-checks it independently before running
  // anything (defense in depth — never trust the orchestrator's placement
  // decision alone for a fail-closed security gate).
  IsolationClass required_isolation_class = 7;
  // Path fields (#496, decision 21), forwarded verbatim from
  // `SubmitRequest`. The orchestrator must not send any of these non-empty
  // unless `backend`'s host declared `shares_submitter_filesystem`; the
  // executor stages them via the same code `sandy run`'s direct path uses
  // (`stage_inputs`/`prepare_outputs`), never re-deriving locality itself —
  // it trusts the orchestrator's placement for this field the same way it
  // already does for `required_isolation_class` above, since both are
  // defense-in-depth re-checked at the backend (isolation class) or made
  // safe by construction (a non-local host that was never sent these fields
  // has nothing to stage).
  repeated Input inputs = 8;
  repeated Output outputs = 9;
  repeated SecretRef secrets = 10;
  // The data-link token (#482, sandyd.md §22): the second `(job_id, token)` pair
  // of a job whose manifest names `inputs`/`outputs`. The host-executor dials
  // back to `forward_back` and claims the data link with it, as it claims the
  // agent link with `link_token`; the orchestrator mints a distinct token for
  // each, so one cannot claim the other's stream. A bearer secret (INV-1): held
  // in memory only, never logged, never written to the manifest, env or mounts.
  // Empty means the job has no data link, which is also how a Dispatch from a
  // sender that predates the field decodes. The orchestrator sets it only for a
  // host that declared `transfer`; nothing sets it until the link exists.
  bytes data_link_token = 11;
}

// Mirrors `sandy.control.v1.Input` (sandy-control-proto) — kept as a
// separate message, not a shared import, matching this crate's existing
// stance of no cross-proto-package dependency between the control RPC and
// the orchestrator<->host-executor contract (see `sandy.control.v1.IsolationClass`'s
// own doc on why it duplicates rather than imports).
message Input {
  string host = 1;
  string name = 2;
  optional string guest_path = 3;
}

// Mirrors `sandy.control.v1.Output`.
message Output {
  optional string name = 1;
  string dest = 2;
}

// Mirrors `sandy.control.v1.SecretRef`.
message SecretRef {
  string name = 1;
  string host_path = 2;
}

// Orchestrator -> host-executor (#340): the orchestrator's own attach-relay
// (sandyd's attach data-plane socket) noticing a job's attach-membership
// count cross zero in either direction. Not a job-level timeout override on
// the wire (stage 1 still has none) — it changes what the host-executor's
// existing fixed wall-clock cap (STAGE1_TIMEOUT_SECS) MEANS for this job:
// suspended while `attached` is true, counting down again once it goes
// false. Sent at most once per transition, never a heartbeat/poll.
message AttachStateChanged {
  string job_id = 1;
  bool attached = 2;
  // Monotonically increasing per job_id, assigned atomically with the
  // transition it reports (sandyd's own per-job serialization, never
  // derived from send/arrival order): two transitions for the same job_id
  // can be enqueued and delivered in either order relative to each other
  // (independent sends on independent connections), so the host-executor
  // keeps only the highest-sequence value it has seen per job_id and
  // discards anything at or below it, rather than trusting arrival order.
  uint64 sequence = 3;
}

// Orchestrator -> host-executor (#477): the client-facing Cancel RPC
// (sandy-control-proto) reached a job that was already placed on a remote
// host. Before this message, sandyd's Cancel only marked the job terminal in
// its own local store — nothing retracted an already-dispatched job on the
// host-executor side (decision 12's own residual-gap note). The
// host-executor calls `control.cancel()` on the matching job's live
// `RunControl`, the same cooperative mechanism an in-process caller already
// uses (#340/#344) — this is just the one missing transport hop, not a new
// cancellation mechanism. Best-effort: if the host is unreachable, or the
// job has already finished, the send/application is a no-op (sandyd's own
// local cancel already took effect regardless; this is the on-top synchronous
// stop for a job genuinely still running on the host).
message Cancel {
  string job_id = 1;
}

// The per-job data link's messages (#482, sandyd.md §22, proposed): a second
// link, dialed back to the orchestrator's mesh listener like the agent link,
// that will carry a job's `inputs` to the host-executor before boot and its
// `outputs` back after the run. The link itself is not built yet. Same length-prefixed framing as everything else here;
// every chunk's `bytes` is at most `MAX_CHUNK_BYTES` (a chunk is never split
// across frames). Not carried on the management connection, so a large
// transfer cannot delay a `Dispatch` or `Cancel` for another job.
message DataLinkMessage {
  oneof op {
    InputChunk input_chunk = 1;
    InputEnd input_end = 2;
    OutputChunk output_chunk = 3;
    OutputEnd output_end = 4;
    TransferError transfer_error = 5;
  }
}

// Orchestrator -> host-executor: the next bytes of one file of a declared
// input, starting at `offset`. `name` is the declared `Input.name`, then `/`
// and the file's path relative to the input root when the input is a
// directory (`Input.name` is one path component, and a directory input is a
// tree). Chunks of one file arrive in order. Symlinks and empty directories
// have no representation yet.
message InputChunk {
  string name = 1;
  uint64 offset = 2;
  bytes bytes = 3;
}

// Orchestrator -> host-executor: every declared input has been sent.
message InputEnd {}

// Host-executor -> orchestrator: the next bytes of one file of the outputs.
// `name` is the declared `Output.name` followed by the file's relative path
// when that output is a directory; an output with no declared name (the
// catch-all) uses the path relative to the outputs root. The chunks of one
// file are contiguous and in order; a file is complete when the next file's
// chunk or `OutputEnd` arrives. `output_index` is the position in
// `Dispatch.outputs` of the declared output the file belongs to: a named output
// and a catch-all (or two outputs with different destinations) can cover the
// same relative name, so the name alone does not say where the file goes. A
// file covered by several outputs is sent once per output, as local collection
// writes it to each. A sender that predates the field sends 0.
message OutputChunk {
  string name = 1;
  bytes bytes = 2;
  uint32 output_index = 3;
}

// Host-executor -> orchestrator: every output has been sent.
message OutputEnd {}

// Either side: the transfer failed (a cap exceeded, a bad name, a local I/O
// error). Terminal for the link. `reason` names the cause and never carries
// file content.
message TransferError {
  string reason = 1;
}
