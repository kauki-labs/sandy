[package]
name = "sandy-backend"
description = "Native VmBackend implementations for sandy: the macOS vfkit and Linux/KVM qemu backends"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/sandy-backend"
keywords = ["sandbox", "microvm", "qemu", "vfkit", "hypervisor"]
categories = ["virtualization", "development-tools"]

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

# The backend hub selects which impl crates are compiled in. `impl-local` (the
# raw-process backend) is on by default; `impl-vm` (the qemu/vfkit stack) is
# opt-in, so a local-only build never compiles the VM backends. `live` is the
# tier-3 containment gate (#135, Linux only; see tests/live_containment.rs).
[features]
default = ["impl-local"]
impl-local = ["dep:sandy-impls-local"]
impl-vm = ["dep:sandy-impls-vm"]
live = []

[dependencies]
sandy.workspace = true
sandy-api.workspace = true
sandy-impls-local = { workspace = true, optional = true }
sandy-impls-vm = { workspace = true, optional = true }

# The hub's own tests exercise every impl directly (not through the feature-gated
# re-exports), so the impl crates are unconditional dev-deps. sandy-api's
# `acceptance` feature exposes the shared VmBackend contract suite
# (vmbackend_contract.rs), test-only.
[dev-dependencies]
anyhow.workspace = true
sandy-api = { workspace = true, features = ["acceptance"] }
sandy-impls-local.workspace = true
sandy-impls-vm.workspace = true
sandy-test-support.workspace = true
tempfile.workspace = true
