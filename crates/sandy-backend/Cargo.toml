[package]
name = "sandy-backend"
description = "Native VmBackend implementations for sandy: the macOS vfkit and Linux/KVM qemu backends"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/sandy-backend"
keywords = ["sandbox", "microvm", "qemu", "vfkit", "hypervisor"]
categories = ["virtualization", "development-tools"]

[lib]
crate-type = ["rlib"]

# The live containment gate (tier-3, #135, Linux only). Off by default so CI and
# `nix flake check` never run it; enable on a Linux host with a user systemd
# instance + cgroup v2. See tests/live_containment.rs.
[features]
live = []

[lints]
workspace = true

[dependencies]
command-group = "5.0.1"
rustix.workspace = true
sandy.workspace = true
sandy-api.workspace = true
tracing.workspace = true
uuid = { workspace = true }

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
