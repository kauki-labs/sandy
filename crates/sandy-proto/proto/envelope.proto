syntax = "proto3";

package sandy.proto.v1;

// The channel envelope: the logical contract every channel backend carries
// (spec sandy-agent-fabric.md §3.3). protobuf is its default codec; a text/chat
// backend re-encodes the same envelope as structured text.
//
// Fields split into two layers:
//   - the discriminator (`message_type`): which kind of message this is;
//   - the body (`payload` + `content_type`): opaque content, text by default,
//     a nested protobuf when structured.
// The opaque body keeps the envelope stable while the per-type contracts evolve.
// `Control` and `Escalate` have a resolved JSON payload contract (#130:
// sandy_fabric::roles::ChannelAssignment, sandy_fabric::escalation::EscalationRequest);
// the rest are still deferred (spec §8 open question), so a backend routes on
// the type without parsing the body.
message Envelope {
  // Monotonic per-channel ordering/dedup key assigned by the sender.
  uint64 sequence = 1;

  // Free-form routing/trace headers (e.g. channel id, sender, cap digest).
  map<string, string> metadata = 2;

  // Media type of `payload`. Empty means text (see CONTENT_TYPE_TEXT); a nested
  // protobuf body sets it to application/protobuf (see CONTENT_TYPE_PROTOBUF).
  string content_type = 3;

  // Opaque message body: UTF-8 text by default, encoded bytes when structured.
  // Never interpreted by the channel layer; routing is on `message_type`.
  bytes payload = 4;

  // The message-type discriminator. Variants are thin markers: the concrete
  // per-type contracts (where resolved — #130: Control, Escalate; the rest
  // deferred, spec §8) ride in `payload` as JSON, not a nested protobuf
  // message. Field numbers 10+ leave room below for more top-level fields, and
  // an unknown (future) variant tag decodes as an absent `message_type` rather
  // than an error (forward compatibility).
  oneof message_type {
    Control control = 10;
    Tty tty = 11;
    Output output = 12;
    Telemetry telemetry = 13;
    Escalate escalate = 14;
    PeerMsg peer_msg = 15;
  }
}

// Orchestrator control: which channels/caps a sandbox should use.
// Payload: JSON-encoded sandy_fabric::roles::ChannelAssignment (#130).
message Control {}

// Interactive terminal traffic to/from a sandbox.
message Tty {}

// Captured job output recorded on the orchestrator channel.
message Output {}

// Optional telemetry sample (local-first; the channel is one sink).
message Telemetry {}

// Escalation toward a human on any device, independent of the orchestrator.
// Payload: JSON-encoded sandy_fabric::escalation::EscalationRequest (#130).
message Escalate {}

// A peer-group message: agents coordinating directly in a closed set.
message PeerMsg {}
