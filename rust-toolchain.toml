# Minor-only pin: rust-overlay resolves "1.98" to the latest 1.98.x in the
# locked flake input, so patch bumps arrive via flake.lock (Dependabot's nix
# ecosystem) and Dependabot's rust-toolchain ecosystem proposes only minor bumps.
[toolchain]
channel = "1.98"
profile = "default"
components = ["cargo", "clippy", "rust-src"]
