# release-plz configuration. The workflow (.github/workflows/release.yaml) runs
# on every push to main:
#
#   release-plz release-pr  opens/updates a PR that bumps versions + changelogs.
#                           Merge it to cut a release.
#   release-plz release     publishes each crate whose version has no release yet,
#                           in dependency order, and creates the tag + GitHub
#                           release for the binaries.
#
# Release model (operator):
#   - crates.io: ALL publishable crates are published (supersedes the earlier
#     "GitHub releases only" decision #158). The two test/local crates stay
#     publish = false in their own Cargo.toml (sandy-test-support,
#     sandy-fabric-compose). sandy-conn used to be on this list too, but
#     sandy-fabric-local now depends on it for real (#159's dial_and_forward),
#     and cargo requires every dependency of a published crate to carry a
#     registry version — publish = false stopped being viable once sandy-conn
#     had a real consumer.
#   - GitHub releases + git tags: the BINARIES only (sandy-cli, sandyd,
#     sandy-agent), each on its own version, tagged <binary-name>-<version>.
#   - A binary's MAJOR version must track sandy-lib's major (enforced by the
#     binary-version-alignment check in .github/workflows/pr.yaml).
#
# crates.io publishing uses trusted publishing: this repo + the Release workflow
# must be registered as a Trusted Publisher for each published crate on crates.io,
# or the publish step fails closed.
#
# BOOTSTRAP (one-time, before the first automated release): trusted publishing
# cannot perform a crate's FIRST publish -- the crate must already exist on
# crates.io before a trusted-publisher relationship can be configured for it. So
# each publishable crate must be `cargo publish`'d once manually (with a token),
# in dependency order, then its trusted publisher registered. Until that is done
# for every crate, the automated release's publish step fails across the board.

[workspace]
# Library crates: published to crates.io, but no standalone git tag or GitHub
# release. Tags and GitHub releases are per-binary only.
git_release_enable = false
git_tag_enable = false
# Publish all publishable crates to crates.io (the three test/local crates opt out
# via publish = false in their own Cargo.toml).
publish = true
# Binaries' GitHub releases get generated notes.
git_release_generate_notes = true
# Releases are driven by an intentional version bump, not lockfile churn.
dependencies_update = false
# Per-binary tag format: <binary-name>-<version>, e.g. `sandy-cli-0.1.1`. Distinct
# from the operator's milestone tags (`v*` / `m*`, handled by github-release.yaml),
# so release-plz's per-binary tags and operator milestone tags never collide.
git_tag_name = "{{ package }}-{{ version }}"

# --- Binaries: published to crates.io AND tagged + GitHub-released per binary. ---
[[package]]
name = "sandy-cli"
git_release_enable = true
git_tag_enable = true

[[package]]
name = "sandyd"
git_release_enable = true
git_tag_enable = true

[[package]]
name = "sandy-agent"
git_release_enable = true
git_tag_enable = true
