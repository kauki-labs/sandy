# release-plz configuration. The workflow (.github/workflows/release.yaml) runs
# on every push to main:
#
#   release-plz release-pr  opens/updates a PR that bumps versions + changelogs.
#                           Merge it to cut a release.
#   release-plz release     creates the tag + GitHub release for each binary
#                           whose version has no release yet, in dependency
#                           order. crates.io publishing is deferred — see
#                           below.
#
# Release model (operator):
#   - crates.io: DEFERRED for now (reverts to the original "GitHub releases
#     only" decision #158, pending #380's crates.io bootstrap). Trusted
#     publishing can't perform a crate's first publish — each publishable
#     crate needs one manual `cargo publish` (with a token), in dependency
#     order, before its trusted-publisher relationship can even be
#     registered. Until that bootstrap happens, `publish = false` here keeps
#     the release pipeline from failing closed on every run trying it.
#   - GitHub releases + git tags: the BINARIES only (sandy-cli, sandyd,
#     sandy-agent), each on its own version, tagged <binary-name>-<version>.
#   - A binary's MAJOR version must track sandy-lib's major (enforced by the
#     binary-version-alignment check in .github/workflows/pr.yaml).
#
# Re-enabling crates.io later: flip `publish` back to `true` here AND remove
# the three binaries' `git_only = true` lines below (release-plz treats
# `publish = true` with `git_only = true` as an error) once the bootstrap
# (manual first publish + trusted-publisher registration per crate) is done —
# see CONTRIBUTING.md's publishing section.
#
# `git_only` on the three binaries (below): with `publish = false` workspace-
# wide, release-plz's default version-baseline lookup (the cargo registry)
# never reflects anything, since nothing is published there. `git_only = true`
# makes it read the binaries' own GitHub tags instead, so a release-pr doesn't
# re-bundle changes a prior GitHub-only release already tagged. Library crates
# have no tags either (git_tag_enable = false above) and stay untracked until
# crates.io publishing resumes — an accepted limitation of the deferral, not a
# new problem this introduces.

[workspace]
# Library crates: no standalone git tag or GitHub release. Tags and GitHub
# releases are per-binary only.
git_release_enable = false
git_tag_enable = false
# crates.io publishing deferred (see above) — no crate publishes yet.
publish = false
# Binaries' GitHub releases get generated notes.
git_release_generate_notes = true
# Releases are driven by an intentional version bump, not lockfile churn.
dependencies_update = false
# Per-binary tag format: <binary-name>-v<version>, e.g. `sandy-cli-v0.1.1` — this
# must match the tags release-plz already created for v0.1.1 (release-plz's own
# default format), since with git_only = true below, release-plz parses this
# template against existing tags to find each binary's latest released version.
# A mismatched template finds no tag and treats 0.1.1 as unreleased, which would
# cut a duplicate release on the first gated push. Distinct from the operator's
# milestone tags (`v*` / `m*`, handled by github-release.yaml), so release-plz's
# per-binary tags and operator milestone tags never collide.
git_tag_name = "{{ package }}-v{{ version }}"

# --- Binaries: tagged + GitHub-released per binary (crates.io deferred, see above). ---
[[package]]
name = "sandy-cli"
git_release_enable = true
git_tag_enable = true
git_only = true

[[package]]
name = "sandyd"
git_release_enable = true
git_tag_enable = true
git_only = true

[[package]]
name = "sandy-agent"
git_release_enable = true
git_tag_enable = true
git_only = true
