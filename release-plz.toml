# release-plz configuration. The workflow (.github/workflows/release.yaml) runs
# on every push to main:
#
#   release-plz release-pr  opens/updates a PR that bumps versions + changelogs.
#                           Merge it to cut a release.
#   release-plz release     creates the tag + GitHub release for each crate whose
#                           Cargo.toml version has no git tag yet. With the config
#                           below, only the binaries are tagged/released.
#
# Releases are PER BINARY, not per crate: only sandy-cli, sandyd, and sandy-agent
# get a tag + GitHub release. Library crates are versioned for dependency
# resolution but are never released or tagged on their own. A binary's MAJOR
# version must track sandy-lib's major — enforced by the binary-version-alignment
# check in .github/workflows/pr.yaml.

[workspace]
# Default for library crates: no standalone tag or GitHub release.
git_release_enable = false
git_tag_enable = false
# The released binaries still need generated notes: github-release.yaml only
# reacts to operator-pushed v*/m* tags, not release-plz's own per-binary tags.
git_release_generate_notes = true
# Operator decision (#158): GitHub releases only for now, no crates.io publishing.
publish = false
# git tags are the version source of truth (nothing reaches crates.io).
git_only = true
# Releases are driven by an intentional version bump, not lockfile churn.
dependencies_update = false
# Per-binary tag format: <binary-name>-<version>, e.g. `sandy-cli-0.1.1`. This is
# deliberately distinct from the operator's milestone tags (`v*` / `m*`, handled by
# github-release.yaml), so release-plz's per-binary tags and operator milestone
# tags never collide.
git_tag_name = "{{ package }}-{{ version }}"

# --- Binaries: released and tagged independently, each on its own version. ---
[[package]]
name = "sandy-cli"
git_release_enable = true
git_tag_enable = true

[[package]]
name = "sandyd"
git_release_enable = true
git_tag_enable = true

[[package]]
name = "sandy-agent"
git_release_enable = true
git_tag_enable = true
