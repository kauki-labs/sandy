[workspace]
resolver = "3"
members = ["crates/*", "impls/*"]

# Shared metadata and dependency versions for every member crate. Members opt in
# with `version.workspace = true`, `thiserror.workspace = true`, and so on.
[workspace.package]
# No shared `version`: each crate owns its version (released per binary).
authors = ["Tibor Csóka <tibor.csoka@kauki.xyz>"]
homepage = "https://kauki.xyz/"
repository = "https://github.com/kauki-labs/sandy"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# The library publishes as `sandy-lib`; the `package` alias keeps the in-tree and
# dependent import path `sandy`. `version` is required for the path deps to be
# publishable to crates.io (cargo drops the path and uses the version on publish).
sandy = { path = "crates/sandy", package = "sandy-lib", version = "0.1.1" }
sandy-api = { path = "crates/sandy-api", version = "0.1.1" }
sandy-backend = { path = "crates/sandy-backend", version = "0.1.1" }
sandy-fsutil = { path = "crates/sandy-fsutil", version = "0.1.1" }
sandy-proto = { path = "crates/sandy-proto", version = "0.1.1" }
sandy-control-proto = { path = "crates/sandy-control-proto", version = "0.1.1" }
sandy-conn = { path = "crates/sandy-conn", version = "0.1.1" }
sandy-executor-proto = { path = "crates/sandy-executor-proto", version = "0.1.1" }
sandy-fabric = { path = "crates/sandy-fabric", version = "0.1.1" }
sandy-impls-local = { path = "impls/local", version = "0.1.1" }
sandy-impls-vm = { path = "impls/vm", version = "0.1.1" }
sandy-test-support = { path = "crates/sandy-test-support" } # publish=false: versionless so cargo drops it on publish
sandy-fabric-local = { path = "impls/fabric-local", version = "0.1.1" }
sandy-orchestrator = { path = "crates/sandy-orchestrator", version = "0.1.1" }
sandy-host-executor = { path = "crates/sandy-host-executor", version = "0.1.1" }
command-group = "5.0.1"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
] }
thiserror = "2.0.20"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# sandyd (#212, B1): a daemon without a subscriber writes no logs at all,
# including its own startup failures.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "env-filter",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fs2 = "0.4"
libc = "0.2"
nix = { version = "0.31.3", default-features = false, features = [
  "process",
  "signal",
] }
rustix = { version = "1.1", default-features = false, features = [
  "std",
  "fs",
  "process",
] }
uuid = { version = "1.10", features = ["v4"] }
clap = { version = "4.5", features = ["derive"] }
octocrab = "0.54"
jsonwebtoken = "10"
minisign-verify = "0.3"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
hex = "0.4"
base64 = "0.23"
portable-pty = "0.9"
tiny_http = "0.12"
tokio-vsock = "0.7"
vsock = "0.5"
socket2 = "0.6"

# sandyd's job state store (#212, B1): vendored SQLite, no system dependency,
# synchronous API wrapped in spawn_blocking (docs/decisions/sandyd.md §4).
rusqlite = { version = "0.40", features = ["bundled"] }

# Channel envelope codec (sandy-proto). prost is the runtime codec; prost-build +
# protox compile the .proto in build.rs. protox is a pure-Rust protobuf compiler,
# so no external `protoc` is needed in the dev shell or the hermetic crane build.
prost = "0.14"
prost-build = "0.14"
protox = "0.10"

# Dev-only, shared so member crates test the same way.
anyhow = "1.0.104"
insta = { version = "1.48.0", features = ["json", "yaml", "redactions"] }
rstest = "0.27.0"
tempfile = "3.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

# Lints applied workspace-wide. Members opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Releases are automated by release-plz (.github/workflows/release.yaml) and
# configured in release-plz.toml: a version bump landing on main creates the tag,
# the GitHub release, and publishes the crates to crates.io in dependency order.

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Snapshot diffing is slow in a debug build; compile insta with optimizations.
[profile.dev.package]
insta.opt-level = 3
