[workspace]
resolver = "3"
members = ["crates/*"]

# Shared metadata and dependency versions for every member crate. Members opt in
# with `version.workspace = true`, `thiserror.workspace = true`, and so on.
[workspace.package]
version = "0.1.0"
authors = ["Tibor Csóka <tibor.csoka@hoprnet.org>"]
homepage = "https://kauki.xyz/"
repository = "https://github.com/kauki-labs/sandy"
license = "MIT"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
thiserror = "2.0.20"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

# Dev-only, shared so member crates test the same way.
anyhow = "1.0.104"
insta = { version = "1.48.0", features = ["json", "yaml", "redactions"] }
rstest = "0.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

# Lints applied workspace-wide. Members opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Snapshot diffing is slow in a debug build; compile insta with optimizations.
[profile.dev.package]
insta.opt-level = 3
